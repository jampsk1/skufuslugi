name: skufuslugi

services:
  web:
    image: skufuslugi:local
    build:
      context: .
    container_name: skufuslugi
    user: "10001:10001"
    restart: unless-stopped
    init: true
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3

volumes:
  caddy_data:
    name: skufuslugi_caddy_data
    external: true
  caddy_config:
    name: skufuslugi_caddy_config
    external: true
